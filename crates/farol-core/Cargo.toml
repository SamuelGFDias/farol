[package]
name = "farol-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "farol"
path = "src/main.rs"

[dependencies]
farol-protocol = { path = "../farol-protocol" }
iced = { version = "~0.13", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
